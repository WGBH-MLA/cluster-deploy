# Dependabot configuration
version: 2
updates:
# GitHub Actions
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: wednesday
    time: '06:00'
    timezone: US/Eastern
  commit-message:
    prefix: ⬆
  cooldown:
    default-days: 1
  labels:
  - maintenance 🔧
  - CI 🦾

# Helm charts
- package-ecosystem: helm
  directories:
  - charts/**/*
  schedule:
    interval: weekly
    day: wednesday
    time: '06:00'
    timezone: US/Eastern
  commit-message:
    prefix: ⬆
  cooldown:
    default-days: 3
    semver-major-days: 7
  labels:
  - maintenance 🔧
  groups:
    mla:
      patterns:
      - charts/mla-*/*
