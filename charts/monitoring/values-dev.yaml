# Dev overrides, layered over values.yaml. Bucket and role come from ../../loki (Terraform).
loki:
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::127946490116:role/dev-loki-s3
  loki:
    storage:
      bucketNames:
        chunks: mla-dev-loki
        ruler: mla-dev-loki
        admin: mla-dev-loki
      s3:
        # Drop the MinIO URL and keys from values.yaml; credentials come from IRSA.
        s3: null
        region: us-east-1
        insecure: false
        s3ForcePathStyle: false

alloy:
  enabled: true
  alloy:
    # Node name lets each DaemonSet pod tail only its own node's pods.
    extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("NODE_NAME")
          }
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "job"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.pods.receiver]
        }

        loki.process "pods" {
          stage.static_labels {
            values = {
              cluster = "dev",
            }
          }
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://monitoring-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
