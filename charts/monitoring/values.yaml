grafana:
  initChownData:
    enabled: false
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
    - grafana.dev.wgbh-mla.org
    tls:
    - secretName: grafana-tls-production
      hosts:
      - grafana.dev.wgbh-mla.org
  persistence:
    enabled: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://monitoring-loki.monitoring.svc.cluster.local:3100
prometheus:
  server:
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    retention: 1y
    remoteWrite:
    - url: http://mimir-nginx.mimir/api/v1/push
  alertmanager:
    enabled: false

alloy:
  enabled: false

loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    persistence:
      storageClass: efs-sc
      size: 1Gi
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
  loki:
    commonConfig:
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    auth_enabled: false
    schemaConfig:
      configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
    ingester:
      lifecycler:
        final_sleep: 0s
      chunk_idle_period: 5m
      chunk_retain_period: 30s
      # max_transfer_retries: 0
      chunk_encoding: snappy
    querier:
      # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
      max_concurrent: 4
    pattern_ingester:
      enabled: true
    compactor:
      retention_enabled: true
      delete_request_store: s3
    analytics:
      reporting_enabled: false
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      reject_old_samples: true
      retention_period: 1y
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomGateway:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  memberlist:
    service:
      publishNotReadyAddresses: true
