traefik:
  deployment:
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: '9100'
      prometheus.io/scrape: 'true'
      prometheus.io/collectionInterval: 15s

  experimental:
    plugins:
      captcha-protect:
        moduleName: github.com/libops/captcha-protect
        version: v1.14.0
      simple-cache:
        moduleName: github.com/ciaranj/cacheify
        version: v1.0.0
  ingressRoute:
    dashboard:
      enabled: true

  log:
    format: json

  accessLog:
    enabled: true
    format: json
    fields:
      headers:
        defaultmode: keep

  metrics:
    addInternals: true
    prometheus:
      addRoutersLabels: true
      headerLabels:
        ip: request_X-Real-Ip
        useragent: request_User-Agent

  tracing:
    addInternals: true
    serviceName: traefik
    safeQueryParams:
    - q
    - f[access_types][]
    - f[producing_organizations][]
    - f[media_type][]
    - f[generes][]
    - f[topics][]
    - f[asset_type][]
    - f[contributing_organizations][]
    - f[producing_organizations][]
    - exact_or_range
    - after_date
    - before_date
    otlp:
      enabled: true
      grpc:
        enabled: true
        endpoint: tempo.tempo:4317
        insecure: true

  ports:
    web:
      http:
        redirections:
          entryPoint:
            permanent: true
            scheme: https
            to: websecure
    websecure:
      allowACMEByPass: true

  providers:
    kubernetesCRD:
      allowExternalNameServices: true
      enabled: true
    kubernetesIngress:
      allowExternalNameServices: true

  # Keep one replica per AZ so every zonal NLB node has a local ready endpoint
  # (required because service.spec.externalTrafficPolicy is Local).
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik

  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-proxy-protocol: '*'
      # Register Traefik pods (not nodes) as NLB targets so a zonal front-end reaches
      # a ready pod in any AZ; instance targets + Local health-gate nodes and black-hole
      # a zone whose node has no ready Traefik pod. Client IP stays via NLB + proxy protocol.
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      # Let either zonal NLB node reach targets in the other AZ so connections
      # are not black-holed when a zone has no ready Traefik pod.
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: 'true'
    spec:
      externalTrafficPolicy: Local
